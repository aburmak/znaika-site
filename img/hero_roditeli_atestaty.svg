<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0fe"/>
      <stop offset="0.5" stop-color="#d6e4fa"/>
      <stop offset="1" stop-color="#bfd3f5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#fbd25d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#sky)"/>
  <circle cx="1320" cy="130" r="150" fill="url(#glow)"/>
  <circle cx="1320" cy="130" r="64" fill="url(#sun)"/>

  <!-- Облака -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="240" cy="120" rx="90" ry="26"/>
    <ellipse cx="300" cy="100" rx="60" ry="22"/>
    <ellipse cx="520" cy="70" rx="80" ry="22"/>
    <ellipse cx="570" cy="92" rx="56" ry="18"/>
    <ellipse cx="980" cy="52" rx="70" ry="20"/>
    <ellipse cx="1030" cy="70" rx="50" ry="15"/>
  </g>

  <!-- Парк / трава -->
  <ellipse cx="800" cy="700" rx="900" ry="210" fill="#a6d18f"/>
  <ellipse cx="800" cy="760" rx="900" ry="220" fill="#8fc177"/>

  <!-- Родитель (центр) -->
  <g>
    <!-- тело -->
    <ellipse cx="800" cy="560" rx="95" ry="130" fill="#2f6bf0"/>
    <ellipse cx="800" cy="560" rx="88" ry="122" fill="#3b7bf5"/>
    <!-- голова -->
    <circle cx="800" cy="330" r="58" fill="#f4c9a0"/>
    <!-- волосы -->
    <path d="M740 320 Q742 268 800 262 Q858 268 860 320 Q860 300 855 290 Q830 250 770 252 Q742 270 740 320 Z" fill="#5a3d2f"/>
    <!-- лицо -->
    <circle cx="782" cy="326" r="4" fill="#4a3225"/>
    <circle cx="818" cy="326" r="4" fill="#4a3225"/>
    <path d="M782 350 Q800 366 818 350" stroke="#c96f5f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- лента/платье -->
    <path d="M770 440 L760 380 L840 380 L830 440 Z" fill="#ffffff"/>
  </g>

  <!-- Ребёнок 1 (11 класс) — слева от родителя -->
  <g>
    <ellipse cx="600" cy="590" rx="58" ry="92" fill="#1f4fd6"/>
    <circle cx="600" cy="414" r="40" fill="#f2c39a"/>
    <path d="M560 420 Q562 380 600 372 Q638 380 640 420 Q638 404 632 396 Q614 366 572 370 Q560 388 560 420 Z" fill="#6b4a2c"/>
    <circle cx="586" cy="414" r="3.5" fill="#4a3225"/>
    <circle cx="614" cy="414" r="3.5" fill="#4a3225"/>
    <path d="M588 432 Q600 444 612 432" stroke="#c9735f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- аттестат за 11 класс (красный) -->
    <g transform="translate(520 360) rotate(-14 46 16)">
      <rect x="0" y="0" width="92" height="60" rx="7" fill="#c21f31"/>
      <rect x="6" y="6" width="80" height="48" rx="4" fill="#e03a4e"/>
      <text x="46" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">Аттестат</text>
      <text x="46" y="46" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#ffd9d9">11 класс</text>
      <rect x="24" y="-1" width="44" height="6" rx="3" fill="#fbd25d"/>
    </g>
    <!-- рука -->
    <circle cx="612" cy="372" r="14" fill="#f2c39a"/>
  </g>

  <!-- Ребёнок 2 (9 класс) — справа от родителя -->
  <g>
    <ellipse cx="1010" cy="598" rx="54" ry="86" fill="#0e8a5f"/>
    <circle cx="1010" cy="440" r="37" fill="#f5cea5"/>
    <path d="M974 444 Q976 408 1010 402 Q1044 408 1046 444 Q1044 430 1039 422 Q1022 396 986 398 Q974 414 974 444 Z" fill="#7a4a24"/>
    <circle cx="1000" cy="444" r="3.5" fill="#4a3225"/>
    <circle cx="1022" cy="444" r="3.5" fill="#4a3225"/>
    <path d="M1001 460 Q1010 470 1020 460" stroke="#cf6f58" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- аттестат за 9 класс (красный) -->
    <g transform="translate(940 400) rotate(12 46 16)">
      <rect x="0" y="0" width="92" height="60" rx="7" fill="#c21f31"/>
      <rect x="6" y="6" width="80" height="48" rx="4" fill="#e03a4e"/>
      <text x="46" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">Аттестат</text>
      <text x="46" y="46" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#ffd9d9">9 класс</text>
      <rect x="24" y="-1" width="44" height="6" rx="3" fill="#fbd25d"/>
    </g>
    <circle cx="998" cy="402" r="13" fill="#f5cea5"/>
  </g>

  <!-- Деревья -->
  <g>
    <rect x="1520" y="470" width="26" height="120" rx="8" fill="#7a5230"/>
    <circle cx="1533" cy="430" r="70" fill="#74b25b"/>
    <circle cx="1495" cy="465" r="45" fill="#67a24f"/>
    <circle cx="1572" cy="462" r="42" fill="#7dbd67"/>
  </g>
  <g opacity="0.75">
    <rect x="1430" y="500" width="18" height="90" rx="6" fill="#7a5230"/>
    <circle cx="1439" cy="468" r="48" fill="#79b464"/>
    <circle cx="1408" cy="492" r="30" fill="#6aa955"/>
  </g>
</svg>
