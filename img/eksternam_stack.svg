<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <defs>
    <linearGradient id="esw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fa"/>
      <stop offset="1" stop-color="#dbe5f5"/>
    </linearGradient>
    <linearGradient id="sh1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#e8b73c"/>
    </linearGradient>
    <linearGradient id="sh2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b73c"/>
      <stop offset="1" stop-color="#d19e2e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="640" fill="url(#esw)"/>
  <rect y="480" width="900" height="160" fill="#cdb38a"/>
  <rect y="480" width="900" height="10" fill="#b99e75"/>

  <!-- Высокая устрашающая стопка учебников 10–11 класс -->
  <g>
    <rect x="170" y="468" width="210" height="26" rx="8" fill="url(#sh2)"/>
    <rect x="180" y="444" width="200" height="24" rx="7" fill="url(#sh1)"/>
    <rect x="168" y="420" width="214" height="24" rx="7" fill="url(#sh2)"/>
    <rect x="182" y="396" width="196" height="24" rx="7" fill="url(#sh1)"/>
    <rect x="170" y="372" width="210" height="24" rx="7" fill="url(#sh2)"/>
    <rect x="184" y="348" width="196" height="24" rx="7" fill="url(#sh1)"/>
    <rect x="172" y="324" width="208" height="24" rx="7" fill="url(#sh2)"/>
    <rect x="186" y="300" width="196" height="24" rx="7" fill="url(#sh1)"/>
    <rect x="174" y="276" width="204" height="24" rx="7" fill="url(#sh2)"/>
    <rect x="188" y="252" width="196" height="24" rx="7" fill="url(#sh1)"/>
    <rect x="176" y="228" width="202" height="26" rx="7" fill="#cf6f7a"/>
    <rect x="190" y="204" width="200" height="24" rx="8" fill="#e8505e"/>
    <rect x="250" y="180" width="140" height="22" rx="8" fill="#c21f31"/>
    <text x="320" y="196" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#ffffff">10–11 класс</text>
    <rect x="72" y="200" width="24" height="270" rx="10" fill="#8a5a33" opacity="0.85"/>
  </g>

  <!-- Рядом маленькая аккуратная папка «Экстернат» -->
  <g transform="translate(640 300)">
    <rect x="0" y="20" width="150" height="100" rx="12" fill="#5b7bd9"/>
    <path d="M0 38 L150 38 L150 30 Q120 46 75 46 Q30 46 0 30 Z" fill="#2f6bf0"/>
    <rect x="14" y="58" width="122" height="10" rx="5" fill="#ffffff" opacity="0.92"/>
    <rect x="14" y="76" width="88" height="10" rx="5" fill="#ffffff" opacity="0.72"/>
    <text x="75" y="40" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#ffffff">Экстернат</text>
    <circle cx="75" cy="-8" r="30" fill="#fbd25d"/>
    <text x="75" y="-1" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#7a5a15">✓</text>
    <path d="M10 300 L10 240 Q10 232 18 232 L132 232 Q140 232 140 240 L140 300" fill="#5b7bd9" stroke="#2f6bf0" stroke-width="3"/>
  </g>

  <text x="360" y="540" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#566078">Один год вместо двух</text>
</svg>
