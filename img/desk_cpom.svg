<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <linearGradient id="cw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fa"/>
      <stop offset="1" stop-color="#dbe5f5"/>
    </linearGradient>
  </defs>
  <rect width="900" height="620" fill="url(#cw)"/>
  <rect y="470" width="900" height="150" fill="#cdb38a"/>
  <rect y="470" width="900" height="10" fill="#b99e75"/>

  <!-- Парта -->
  <g>
    <rect x="300" y="360" width="300" height="16" rx="8" fill="#8a5a33"/>
    <rect x="330" y="376" width="240" height="14" rx="6" fill="#7a4e2b"/>
    <rect x="352" y="390" width="46" height="60" fill="#c4975f"/>
    <rect x="472" y="390" width="46" height="60" fill="#c4975f"/>
    <rect x="336" y="404" width="26" height="90" rx="10" fill="#d8b47f" opacity="0.5"/>
    <rect x="508" y="404" width="26" height="90" rx="10" fill="#d8b47f" opacity="0.5"/>
    <!-- стул -->
    <rect x="256" y="320" width="110" height="14" rx="7" fill="#2f6bf0"/>
    <rect x="262" y="430" width="14" height="60" rx="6" fill="#2455c9"/>
  </g>

  <!-- Стопка «Школа» -->
  <g>
    <rect x="316" y="330" width="96" height="16" rx="7" fill="#ffd75e"/>
    <rect x="320" y="314" width="92" height="16" rx="7" fill="#e8b73c"/>
    <rect x="318" y="298" width="94" height="16" rx="7" fill="#ffd75e"/>
    <rect x="322" y="282" width="90" height="16" rx="7" fill="#e8b73c"/>
    <rect x="384" y="332" width="72" height="34" rx="5" fill="#5b7bd9"/>
    <text x="420" y="353" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#ffffff">Школа</text>
  </g>

  <!-- Стопка «колледж» -->
  <g>
    <rect x="540" y="330" width="96" height="16" rx="7" fill="#9ad0ff"/>
    <rect x="544" y="314" width="92" height="16" rx="7" fill="#7cb8ea"/>
    <rect x="542" y="298" width="94" height="16" rx="7" fill="#9ad0ff"/>
    <rect x="546" y="282" width="90" height="16" rx="7" fill="#7cb8ea"/>
    <rect x="492" y="300" width="66" height="30" rx="5" fill="#e94e6a"/>
    <text x="525" y="320" text-anchor="middle" font-family="Arial" font-size="13.5" font-weight="bold" fill="#ffffff">колледж</text>
  </g>

  <!-- Студенческий билет / зачётка между стопками -->
  <g transform="rotate(-8 454 300)">
    <rect x="428" y="264" width="54" height="76" rx="9" fill="#2f6bf0"/>
    <rect x="436" y="272" width="38" height="60" rx="5" fill="#f4f6fb"/>
    <circle cx="455" cy="286" r="8" fill="#e8ecf8"/>
    <rect x="440" y="300" width="30" height="3" rx="1" fill="#c6d2ee"/>
    <rect x="440" y="308" width="30" height="3" rx="1" fill="#c6d2ee"/>
    <rect x="440" y="316" width="22" height="3" rx="1" fill="#c6d2ee"/>
    <text x="455" y="196" text-anchor="middle" font-family="Arial" font-size="9.5" fill="#5b7bd9" transform="rotate(-8 455 200)">СТУДЕНЧЕСКИЙ БИЛЕТ</text>
    <path d="M442 252 L446 236 L452 252" fill="#fbd25d" stroke="#e6b94a" stroke-width="2"/>
  </g>
</g>
</svg>
